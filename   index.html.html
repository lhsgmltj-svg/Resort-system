-- 1) resorts
create table resorts (
  id text primary key,
  name text not null,
  short text,
  location text,
  total_rooms int not null,
  max_capacity int not null,
  limit_count int default 2,
  limit_period text default '분기',
  win_method text default '추첨제',
  peak_season text,
  status text default '운영중',
  description text,
  created_at timestamp default now()
);

-- 2) bookings (가중치 추첨 지원)
create table bookings (
  id uuid primary key default gen_random_uuid(),
  resort_id text references resorts(id),
  resort_name text,
  check_in date not null,
  check_out date not null,
  name text not null,
  employee_id text not null,
  dept text,
  email text,
  phone text,
  status text default '신청',
  fail_count int default 0,
  weight_score int default 10,
  no_show_count int default 0,
  lottery_rank int,
  created_at timestamp default now()
);

-- 3) lottery_logs (추첨 이력)
create table lottery_logs (
  id uuid primary key default gen_random_uuid(),
  resort_id text,
  target_date date,
  executed_at timestamp default now(),
  total_applicants int,
  winners int,
  algorithm text,
  result jsonb
);

-- 4) Indexes
create index idx_bookings_employee on bookings(employee_id);
create index idx_bookings_resort_date on bookings(resort_id, check_in);
create index idx_bookings_status on bookings(status);

-- 5) RLS (무예산: anon read, authenticated write로 시작)
alter table resorts enable row level security;
alter table bookings enable row level security;
create policy "public read resorts" on resorts for select using (true);
create policy "public read bookings" on bookings for select using (true);
create policy "insert bookings" on bookings for insert with check (true);
create policy "update bookings" on bookings for update using (true);

-- 7) 가중치 추첨 RPC (미당첨자 우대: base 10 + fail_count*10 + random())
create or replace function run_weighted_lottery(p_resort_id text, p_check_in date)
returns jsonb language plpgsql as $$
declare
  v record; v_result jsonb := '[]'::jsonb;
  v_rank int := 0;
begin
  for v in
    select *, (10 + fail_count*10 + random()) as score
    from bookings
    where resort_id = p_resort_id and check_in = p_check_in and status = '신청'
    order by (10 + fail_count*10 + random()) desc
  loop
    v_rank := v_rank + 1;
    v_result := v_result || jsonb_build_object('employee_id', v.employee_id, 'name', v.name, 'score', v.score, 'rank', v_rank);
  end loop;
