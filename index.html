<!DOCTYPE html>
<html lang="ko">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LG 휴양소 통합 예약 시스템 - 최종</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">{"imports":{"supabase":"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}</script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif}</style>
</head>
<body class="bg-[#FAFAF8] text-zinc-900">
<div id="app"></div>
<script type="module">
import { createClient } from 'supabase';
const SUPABASE_URL_DEFAULT = 'https://ertapoehpcxuntwzzcix.supabase.co';
let supabase = null;
let supabaseUrl = localStorage.getItem('sb_url') || SUPABASE_URL_DEFAULT;
let supabaseKey = localStorage.getItem('sb_key') || '';
function initSupabase(){
  const u = localStorage.getItem('sb_url') || SUPABASE_URL_DEFAULT;
  const k = localStorage.getItem('sb_key') || '';
  supabaseUrl = u; supabaseKey = k;
  if(u && k && k.length>20){
    try{ supabase = createClient(u,k); console.log('Supabase OK'); return true; }catch(e){ console.error(e); supabase=null; return false;}
  } else { supabase=null; return false; }
}
initSupabase();

const PIN_KEY='admin_pin_code';
const getPin=()=>localStorage.getItem(PIN_KEY)||'1234';
const setPin=(p)=>localStorage.setItem(PIN_KEY,p);

const FALLBACK_RESORTS=[
  {id:'lg-uljin', name:'LG생활연수원(울진)', short:'LG울진', location:'경북 울진군', total_rooms:32, max_capacity:4, booking_type:'추첨제', status:'운영중', peak:'07.15~08.20', desc:'해송림'},
  {id:'forest-resom', name:'포레스트리솜(제천)', short:'포레스트', location:'충북 제천시', total_rooms:48, max_capacity:6, booking_type:'선착순', status:'운영중', peak:'10.01~11.15', desc:'숲속 스파'},
  {id:'high1', name:'하이원리조트(정선)', short:'하이원', location:'강원 정선군', total_rooms:60, max_capacity:5, booking_type:'추첨제', status:'운영중', peak:'12.15~02.28', desc:'스키장'},
  {id:'sky-bay', name:'스카이베이(강릉)', short:'스카이베이', location:'강원 강릉시', total_rooms:24, max_capacity:4, booking_type:'선착순', status:'운영중', peak:'07.01~08.31', desc:'오션뷰'},
];

let resorts=[...FALLBACK_RESORTS];
let applications=[];
let view='user'; // user, admin
let adminAuthed=false;
let selectedDates=[];
let selectedResortId=null;
let showBookingForm=false;
let showSettings=false;
let showPinModal=false;
let showChangePinModal=false;
let pinInput=''; pinError='';
let newPinInput='';
let tempKeyInput=''; tempUrlInput='';
let loadingResorts=true;

async function loadData(){
  loadingResorts=true; render();
  if(supabase){
    try{
      const {data: rData, error: rErr} = await supabase.from('resorts').select('*').limit(100);
      if(!rErr && rData && rData.length>0){
        resorts = rData.map(r=>({
          id: r.id, name: r.name, short: r.short||r.name.slice(0,4), location: r.location||'', total_rooms: r.total_rooms||30, max_capacity: r.max_capacity||4, booking_type: r.booking_type||r.win_method||'추첨제', status: r.status||'운영중', peak: r.peak_season||'', desc: r.description||''
        }));
      }
      const {data: aData, error: aErr} = await supabase.from('applications').select('*').order('created_at',{ascending:false}).limit(500);
      if(!aErr && aData){ applications = aData.map(mapAppFromDB); }
    }catch(e){ console.log('load error', e); }
  } else {
    try{ const local = JSON.parse(localStorage.getItem('applications_local')||'[]'); applications = local; }catch{}
  }
  loadingResorts=false; render();
}
function mapAppFromDB(row){
  return {
    id: row.id, name: row.name, employee_id: row.employee_id, department: row.department, email: row.email, phone: row.phone,
    resort_id: row.resort_id, check_in: row.check_in, check_out: row.check_out, status: row.status, failed_count: row.failed_count||0, created_at: row.created_at
  }
}

function getRemaining(resortId, dateStr){
  const total = (resorts.find(r=>r.id===resortId)||{}).total_rooms||0;
  if(!dateStr) return total;
  let booked=0;
  for(const app of applications){
    if(app.resort_id!==resortId) continue;
    if(app.status==='취소') continue;
    if(dateStr>=app.check_in && dateStr<=app.check_out) booked++;
  }
  return Math.max(0, total-booked);
}

const form={ name:'', employee_id:'', department:'', email:'', phone:'' };

function render(){
  const connected = !!supabase;
  const appEl = document.getElementById('app');
  const header = `
  <header class="sticky top-0 z-20 bg-white border-b">
    <div class="max-w-[1200px] mx-auto px-4 h-[56px] flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-[#A50034] text-white font-bold rounded flex items-center justify-center">H</div>
        <div>
          <div class="font-bold text-[15px]">휴양소 통합 예약</div>
          <div class="text-[11px] text-zinc-500">${connected?'<span class="text-emerald-600">● Supabase 연결됨</span>':'<span class="text-amber-600">● 로컬 모드 - 설정에서 키 입력 필요</span>'}</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.openSettings()" class="px-3 py-1.5 text-[13px] border rounded-lg hover:bg-zinc-50">⚙️ 설정</button>
        <button onclick="window.switchView('user')" class="px-3 py-1.5 text-[13px] rounded-lg ${view==='user'?'bg-zinc-900 text-white':'border'}">사용자</button>
        <button onclick="window.switchView('admin')" class="px-3 py-1.5 text-[13px] rounded-lg ${view==='admin'?'bg-zinc-900 text-white':'border'}">관리자</button>
      </div>
    </div>
  </header>`;

  if(view==='user'){
    // calendar generation - next 2 months
    const today = new Date(); today.setHours(0,0,0,0);
    const months=[];
    for(let m=0;m<2;m++){
      const d = new Date(today.getFullYear(), today.getMonth()+m, 1);
      months.push(d);
    }
    const calendarHtml = months.map(monthDate=>{
      const year=monthDate.getFullYear(); const month=monthDate.getMonth();
      const firstDay=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      let cells='';
      for(let i=0;i<firstDay;i++) cells+=`<div class="h-[36px]"></div>`;
      for(let day=1; day<=daysInMonth; day++){
        const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const isSelected = selectedDates.includes(dateStr);
        const isPast = new Date(dateStr) < today;
        cells+=`<button ${isPast?'disabled':''} onclick="window.toggleDate('${dateStr}')" class="h-[36px] text-[13px] rounded-lg border ${isPast?'bg-zinc-100 text-zinc-300 cursor-not-allowed': isSelected?'bg-[#A50034] text-white border-[#A50034]':'hover:bg-zinc-50 bg-white'}">${day}</button>`;
      }
      return `<div class="bg-white rounded-xl border p-3"><div class="font-semibold text-[14px] mb-2">${year}년 ${month+1}월</div><div class="grid grid-cols-7 gap-1 text-[11px] text-center text-zinc-400 mb-1"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid grid-cols-7 gap-1">${cells}</div></div>`;
    }).join('');

    const resortCards = resorts.map(r=>{
      const remaining = selectedDates.length? Math.min(...selectedDates.map(d=>getRemaining(r.id,d))) : r.total_rooms;
      return `<div class="bg-white rounded-2xl border p-4 flex flex-col gap-2">
        <div class="flex justify-between items-start">
          <div><div class="font-bold">${r.name}</div><div class="text-[12px] text-zinc-500">${r.location} · ${r.desc}</div></div>
          <span class="text-[11px] px-2 py-0.5 rounded-full ${r.booking_type==='추첨제'?'bg-violet-100 text-violet-700':'bg-emerald-100 text-emerald-700'}">${r.booking_type}</span>
        </div>
        <div class="flex gap-2 text-[12px]">
          <span class="px-2 py-1 bg-zinc-100 rounded">총 ${r.total_rooms}실</span>
          <span class="px-2 py-1 ${remaining<=5?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-700'} rounded font-semibold">${remaining}실 남음</span>
          <span class="px-2 py-1 bg-zinc-100 rounded">최대 ${r.max_capacity}인</span>
        </div>
        <button onclick="window.selectResort('${r.id}')" class="mt-2 w-full py-2 rounded-xl text-[14px] font-semibold ${selectedResortId===r.id?'bg-[#A50034] text-white':'bg-zinc-900 text-white hover:bg-zinc-800'}">선택 ${selectedResortId===r.id?'✓':''}</button>
      </div>`;
    }).join('');

    const bookingBar = `
      <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-10">
        <div class="max-w-[1200px] mx-auto flex items-center justify-between gap-3">
          <div class="text-[13px]">${selectedDates.length?selectedDates.join(', '):'날짜를 선택하세요'} ${selectedResortId? '· '+(resorts.find(r=>r.id===selectedResortId)?.name||''):''}</div>
          <button ${(!selectedDates.length||!selectedResortId)?'disabled':''} onclick="window.openBooking()" class="px-5 py-2 bg-[#A50034] text-white rounded-xl text-[14px] font-bold disabled:bg-zinc-300">예약 신청</button>
        </div>
      </div>`;

    appEl.innerHTML = header + `
      <main class="max-w-[1200px] mx-auto px-4 py-6 pb-[100px] grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-6">
        <div class="space-y-4">
          <div class="text-[14px] font-semibold">체크인 / 체크아웃 (최대 2개까지 선택, 같은 월 아님)</div>
          <div class="space-y-3">${calendarHtml}</div>
          ${selectedDates.length?`<button onclick="window.clearDates()" class="w-full py-2 border rounded-xl text-[13px]">선택 초기화</button>`:''}
          ${!connected?`<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[12px]">⚠️ Supabase 키가 없어서 신청내역이 DB에 저장되지 않습니다.<br/>오른쪽 위 설정에서 anon 키를 입력하면 바로 저장됩니다.<br/><br/><b>필요 SQL (Supabase SQL Editor에서 실행):</b><br/><code class="text-[10px] block whitespace-pre-wrap bg-white p-2 rounded mt-2">alter table applications drop constraint if exists applications_resort_id_fkey;
alter table applications alter column resort_id type text;
drop policy if exists "allow all" on applications;
create policy "allow all" on applications for all using (true) with check (true);
drop policy if exists "allow all" on resorts;
create policy "allow all" on resorts for all using (true) with check (true);</code></div>`:''}
        </div>
        <div class="space-y-4">
          <div class="flex items-center justify-between"><div class="font-bold">휴양소 선택</div><div class="text-[12px] text-zinc-500">${loadingResorts?'불러오는 중...':resorts.length+'개 운영중'}</div></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${resortCards}</div>
        </div>
      </main>
      ${bookingBar}
      ${renderModals()}
    `;
  } else {
    // admin view
    if(!adminAuthed){
      appEl.innerHTML = header + `<main class="max-w-[600px] mx-auto px-4 py-20 text-center"><div class="bg-white border rounded-2xl p-8"><h2 class="font-bold text-[18px] mb-4">관리자 인증</h2><p class="text-[13px] text-zinc-500 mb-4">인증번호를 입력하세요 (기본 1234)</p><input id="pinInput" type="password" placeholder="인증번호" class="w-full border rounded-xl px-4 py-3 text-center text-[16px] tracking-[0.5em]"/><div class="text-red-500 text-[12px] mt-2">${pinError}</div><button onclick="window.tryAuth()" class="w-full mt-4 py-3 bg-zinc-900 text-white rounded-xl font-bold">입장</button></div></main>${renderModals()}`;
      setTimeout(()=>{ const el=document.getElementById('pinInput'); if(el) el.focus(); },100);
      return;
    }
    // admin authed
    const totalApps = applications.length;
    const byResort = resorts.map(r=>({resort:r, count: applications.filter(a=>a.resort_id===r.id).length}));
    const appsHtml = applications.slice(0,100).map(a=>`<tr class="border-b text-[12px]"><td class="py-2 px-2">${a.name}</td><td class="px-2">${a.employee_id}</td><td class="px-2">${resorts.find(r=>r.id===a.resort_id)?.short||a.resort_id}</td><td class="px-2">${a.check_in}~${a.check_out}</td><td class="px-2">${a.status}</td><td class="px-2">${new Date(a.created_at).toLocaleString()}</td></tr>`).join('');
    appEl.innerHTML = header + `
      <main class="max-w-[1200px] mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-[18px]">관리자 대시보드 <span class="text-[12px] font-normal text-zinc-500">총 ${totalApps}건</span></h2>
          <div class="flex gap-2">
            <button onclick="window.openChangePin()" class="px-3 py-1.5 border rounded-lg text-[12px]">인증번호 변경</button>
            <button onclick="window.logoutAdmin()" class="px-3 py-1.5 border rounded-lg text-[12px]">로그아웃</button>
            <button onclick="window.downloadExcel()" class="px-3 py-1.5 bg-zinc-900 text-white rounded-lg text-[12px]">엑셀 다운로드</button>
          </div>
        </div>
        <div class="grid grid-cols-4 gap-3 mb-6">${byResort.map(br=>`<div class="bg-white border rounded-xl p-3"><div class="text-[12px] text-zinc-500">${br.resort.short}</div><div class="text-[20px] font-bold">${br.count}건</div></div>`).join('')}</div>
        <div class="bg-white border rounded-xl overflow-auto">
          <table class="w-full"><thead class="bg-zinc-50 text-[11px] text-zinc-500"><tr><th class="text-left py-2 px-2">이름</th><th class="text-left px-2">사번</th><th class="text-left px-2">휴양소</th><th class="text-left px-2">날짜</th><th class="text-left px-2">상태</th><th class="text-left px-2">신청시간</th></tr></thead><tbody>${appsHtml||'<tr><td colspan=6 class="py-10 text-center text-zinc-400">신청내역이 없습니다. Supabase 연결 후 신청해보세요.</td></tr>'}</tbody></table>
        </div>
        <div class="mt-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-[12px]">
          <b>신청이 안 뜨면 체크:</b><br/>
          1) Supabase > SQL Editor에서 아래 실행<br/>
          <code class="block bg-white p-2 rounded mt-2 text-[11px] whitespace-pre-wrap">alter table applications drop constraint if exists applications_resort_id_fkey;
alter table applications alter column resort_id type text;
alter table applications drop constraint if exists applications_resort_id_fkey1;
drop policy if exists "allow all" on applications;
create policy "allow all" on applications for all using (true) with check (true);
drop policy if exists "allow all" on resorts;
create policy "allow all" on resorts for all using (true) with check (true);
alter table resorts enable row level security;
alter table applications enable row level security;</code><br/>
          2) Table Editor > applications > RLS가 초록색으로 allow all 있는지 확인<br/>
          3) 설정에서 키 다시 저장 후 새로고침
        </div>
      </main>
      ${renderModals()}
    `;
  }

  function renderModals(){
    return `
      ${showBookingForm?`
      <div class="fixed inset-0 bg-black/40 z-30 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-[420px] p-6">
          <h3 class="font-bold text-[16px] mb-4">예약 신청 - ${resorts.find(r=>r.id===selectedResortId)?.name}</h3>
          <div class="space-y-3">
            <input id="f_name" placeholder="이름" value="${form.name}" class="w-full border rounded-xl px-3 py-2 text-[14px]"/>
            <input id="f_emp" placeholder="사번" value="${form.employee_id}" class="w-full border rounded-xl px-3 py-2 text-[14px]"/>
            <input id="f_dept" placeholder="부서" value="${form.department}" class="w-full border rounded-xl px-3 py-2 text-[14px]"/>
            <input id="f_email" placeholder="이메일" value="${form.email}" class="w-full border rounded-xl px-3 py-2 text-[14px]"/>
            <input id="f_phone" placeholder="연락처" value="${form.phone}" class="w-full border rounded-xl px-3 py-2 text-[14px]"/>
            <div class="text-[12px] text-zinc-500">선택 날짜: ${selectedDates.join(', ')}</div>
          </div>
          <div class="flex gap-2 mt-6">
            <button onclick="window.closeBooking()" class="flex-1 py-3 border rounded-xl">취소</button>
            <button onclick="window.submitBooking()" class="flex-1 py-3 bg-[#A50034] text-white rounded-xl font-bold">신청 완료</button>
          </div>
        </div>
      </div>`:''}

      ${showSettings?`
      <div class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-[520px] p-6">
          <h3 class="font-bold text-[16px] mb-2">Supabase 설정</h3>
          <p class="text-[12px] text-zinc-500 mb-4">아래 키를 붙여넣고 저장하면 바로 DB에 저장됩니다. 줄바꿈 없이 한 줄로 붙여넣으세요.</p>
          <div class="space-y-3">
            <div><label class="text-[12px]">Supabase URL</label><input id="s_url" value="${supabaseUrl}" class="w-full border rounded-xl px-3 py-2 text-[13px]"/></div>
            <div><label class="text-[12px]">Anon / Publishable Key (eyJ... 또는 sb_publishable_...)</label><textarea id="s_key" rows="3" class="w-full border rounded-xl px-3 py-2 text-[12px]">${supabaseKey}</textarea></div>
          </div>
          <div class="flex gap-2 mt-6">
            <button onclick="window.closeSettings()" class="flex-1 py-3 border rounded-xl">닫기</button>
            <button onclick="window.saveSettings()" class="flex-1 py-3 bg-zinc-900 text-white rounded-xl font-bold">저장하고 새로고침</button>
          </div>
          <div class="mt-4 text-[11px] text-zinc-400">팁: 키는 Supabase > Settings > API > Legacy anon 키를 복사하세요. Publishable key(sb_publishable_)도 됩니다.</div>
        </div>
      </div>`:''}

      ${showChangePinModal?`
      <div class="fixed inset-0 bg-black/40 z-30 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-[340px] p-6">
          <h3 class="font-bold mb-4">인증번호 변경</h3>
          <input id="newPin" type="password" placeholder="새 인증번호 (4자리)" class="w-full border rounded-xl px-3 py-3 text-center tracking-[0.5em]"/>
          <div class="flex gap-2 mt-4"><button onclick="window.closeChangePin()" class="flex-1 py-2 border rounded-xl">취소</button><button onclick="window.saveNewPin()" class="flex-1 py-2 bg-zinc-900 text-white rounded-xl">변경</button></div>
        </div>
      </div>`:''}
    `;
  }

  window.toggleDate = (dateStr)=>{
    if(selectedDates.includes(dateStr)){
      selectedDates = selectedDates.filter(d=>d!==dateStr);
    } else {
      if(selectedDates.length>=2){ alert('최대 2개까지만 선택 가능합니다'); return; }
      selectedDates.push(dateStr); selectedDates.sort();
    }
    render();
  };
  window.clearDates=()=>{ selectedDates=[]; render(); };
  window.selectResort=(id)=>{ selectedResortId=id; render(); };
  window.openBooking=()=>{ showBookingForm=true; render(); setTimeout(()=>{ ['f_name','f_emp','f_dept','f_email','f_phone'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', e=>{ const k=id.split('_')[1]; if(k==='name') form.name=e.target.value; if(k==='emp') form.employee_id=e.target.value; if(k==='dept') form.department=e.target.value; if(k==='email') form.email=e.target.value; if(k==='phone') form.phone=e.target.value; }); }); },100); };
  window.closeBooking=()=>{ showBookingForm=false; render(); };
  window.openSettings=()=>{ showSettings=true; tempKeyInput=supabaseKey; tempUrlInput=supabaseUrl; render(); };
  window.closeSettings=()=>{ showSettings=false; render(); };
  window.saveSettings=()=>{
    const url = document.getElementById('s_url').value.trim();
    const key = document.getElementById('s_key').value.trim().replace(/\s+/g,'');
    if(!key){ alert('키를 입력하세요'); return; }
    localStorage.setItem('sb_url', url);
    localStorage.setItem('sb_key', key);
    alert('저장되었습니다. 새로고침합니다.');
    location.reload();
  };
  window.switchView=(v)=>{
    if(v==='admin' && !adminAuthed){ view='admin'; showPinModal=true; pinError=''; render(); }
    else { view=v; render(); }
  };
  window.tryAuth=()=>{
    const input = document.getElementById('pinInput').value;
    if(input===getPin()){ adminAuthed=true; pinError=''; render(); loadData(); }
    else { pinError='인증번호가 틀렸습니다'; document.getElementById('pinInput').value=''; render(); }
  };
  window.logoutAdmin=()=>{ adminAuthed=false; view='user'; render(); };
  window.openChangePin=()=>{ showChangePinModal=true; render(); };
  window.closeChangePin=()=>{ showChangePinModal=false; render(); };
  window.saveNewPin=()=>{
    const v = document.getElementById('newPin').value.trim();
    if(v.length<4){ alert('4자리 이상 입력'); return; }
    setPin(v); alert('변경됨: '+v); showChangePinModal=false; render();
  };
  window.downloadExcel=()=>{
    let csv = '이름,사번,부서,이메일,전화,휴양소,체크인,체크아웃,상태,신청시간\n';
    applications.forEach(a=>{ csv+=`${a.name},${a.employee_id},${a.department},${a.email},${a.phone},${a.resort_id},${a.check_in},${a.check_out},${a.status},${a.created_at}\n`; });
    const blob = new Blob([csv], {type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='applications.csv'; a.click();
  };
  window.submitBooking=async()=>{
    const name=document.getElementById('f_name').value.trim();
    const emp=document.getElementById('f_emp').value.trim();
    const dept=document.getElementById('f_dept').value.trim();
    const email=document.getElementById('f_email').value.trim();
    const phone=document.getElementById('f_phone').value.trim();
    if(!name||!emp){ alert('이름과 사번은 필수입니다'); return; }
    if(selectedDates.length===0||!selectedResortId){ alert('날짜와 휴양소를 선택하세요'); return; }
    const check_in = selectedDates[0];
    const check_out = selectedDates[1]||selectedDates[0];
    const newApp={ id: 'local_'+Date.now(), name, employee_id:emp, department:dept, email, phone, resort_id:selectedResortId, check_in, check_out, status:'신청', failed_count:0, created_at:new Date().toISOString() };
    // local save first
    applications.unshift(newApp);
    try{ localStorage.setItem('applications_local', JSON.stringify(applications)); }catch{}
    showBookingForm=false; render();
    // supabase insert
    if(supabase){
      try{
        const { data, error } = await supabase.from('applications').insert([{
          name, employee_id:emp, department:dept, email, phone, resort_id:selectedResortId, check_in, check_out, status:'신청', failed_count:0
        }]).select();
        if(error){
          console.error('Supabase insert error', error);
          alert('DB 저장 실패: '+error.message+'\n\nSupabase > SQL Editor에서 아래를 실행하세요:\n\nalter table applications drop constraint if exists applications_resort_id_fkey;\nalter table applications alter column resort_id type text;\ncreate policy "allow all" on applications for all using (true) with check (true);');
        } else {
          console.log('insert ok', data);
          // reload from db to get real uuid
          const {data: fresh} = await supabase.from('applications').select('*').order('created_at',{ascending:false}).limit(200);
          if(fresh) applications = fresh.map(mapAppFromDB);
          alert('예약이 Supabase에 저장되었습니다!');
          render();
        }
      }catch(e){ console.error(e); alert('DB 오류: '+e.message); }
    } else {
      alert('로컬에만 저장되었습니다. 설정에서 Supabase 키를 입력하면 DB에 저장됩니다.');
    }
  };
}

loadData();
</script>
