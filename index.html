<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-wrap"></div>
<script>
function safeStoreGet(k){try{return localStorage.getItem(k)}catch{return null}}
function safeStoreSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function safeStoreRemove(k){try{localStorage.removeItem(k)}catch{}}
const CONFIG = {
  supabaseUrl: safeStoreGet('resort_sb_url') || 'https://ertapoehpcxuntwzzcix.supabase.co',
  anonKey: safeStoreGet('resort_sb_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVydGFwb2VocGN4dW50d3p6Y2l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MjYyOTcsImV4cCI6MjEwNjMwMjI5N30.-8BiX7Qx0lAwtNpxnWQ2g-DGbMVfiCRhV7fFBngz-rk',
  edgeFunction: 'send-confirmation-emails'
};
const STATUS = {
  pending:['추첨대기','amber'], confirmed:['예약확정','green'], waitlist:['대기','blue'],
  cancelled:['취소','gray'], failed:['미당첨','red'], no_show:['노쇼','red']
};
const state = {
  view:'user', resorts:[], publicResorts:[], applications:[], blacklists:[], lotteryRuns:[], lotteryResults:[],
  emailLogs:[], adminLogs:[], blockedDates:[], rangeStart:null, rangeEnd:null, calendarAnchor:firstOfMonth(new Date()),
  availability:{}, session:null, adminTab:'dashboard', appFilter:{q:'',resort:'all',status:'all',month:''},
  lotteryResort:'', lotteryMonth:monthValue(new Date()), selectedRun:null, lotterySummary:[], lotteryDay:null,
  emailMonth:monthValue(new Date()), blacklistQ:'', resortBlockedFilter:'all', loading:false
};
function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function fmtDate(d){if(!d)return '-'; const x=typeof d==='string'?parseLocalDate(d):d; return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`}
function localDateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseLocalDate(s){const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffNights(a,b){if(!a||!b)return 0;return Math.round((parseLocalDate(b)-parseLocalDate(a))/86400000)}
function monthValue(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fmtDateTime(v){if(!v)return '-';return new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}
function statusBadge(s){const [label,c]=STATUS[s]||[s||'-','gray'];return `<span class="badge ${c}">${label}</span>`}
function toast(msg,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('toastRoot').appendChild(el);setTimeout(()=>el.remove(),3200)}
function setLoading(v){state.loading=v}
function authToken(){return state.session?.access_token || CONFIG.anonKey}
async function sb(path,{method='GET',body,admin=false,headers={}}={}){
  const token=admin?authToken():CONFIG.anonKey;
  const res=await fetch(CONFIG.supabaseUrl.replace(/\/$/,'')+path,{method,headers:{apikey:CONFIG.anonKey,Authorization:`Bearer ${token}`,'Content-Type':'application/json',...headers},body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await res.text(); let data=null; try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!res.ok) throw new Error(data?.message||data?.error_description||data?.hint||data?.details||`${res.status} ${res.statusText}`);
  return data;
}
async function rpc(name,args={},admin=false){return sb(`/rest/v1/rpc/${name}`,{method:'POST',body:args,admin})}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">${html}</div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function activePeriod(r){const now=Date.now(),s=r.application_start?new Date(r.application_start).getTime():null,e=r.application_end?new Date(r.application_end).getTime():null;if(s&&now<s)return {open:false,label:`${fmtDateTime(r.application_start)} 오픈`,c:'blue'};if(e&&now>e)return {open:false,label:'신청 마감',c:'gray'};return {open:true,label:e?`${fmtDateTime(r.application_end)} 마감`:'신청 가능',c:'green'}}
function resortCover(r){const img=r.image_url?`background-image:linear-gradient(to top,rgba(15,23,42,.72),rgba(15,23,42,.08)),url('${esc(r.image_url)}')`:'';return `<div class="resort-cover" style="${img}"><div class="icon">${esc(r.icon||'🏨')}</div></div>`}
async function loadPublicResorts(){
  try{const rows=await sb('/rest/v1/resorts?select=*&is_active=eq.true&order=name.asc');state.publicResorts=rows||[];if(state.view==='user')state.resorts=state.publicResorts;render()}
  catch(e){toast('Supabase 연결 또는 DB 설정을 확인해주세요: '+e.message,'error');render()}
}
async function refreshAvailability(){
  state.availability={}; if(!state.rangeStart||!state.rangeEnd){render();return}
  const jobs=state.publicResorts.map(async r=>{try{state.availability[r.id]=await rpc('get_resort_remaining',{p_resort_id:r.id,p_check_in:state.rangeStart,p_check_out:state.rangeEnd})}catch{state.availability[r.id]=null}});
  await Promise.all(jobs);render();
}
function selectDay(s){const today=localDateStr(new Date());if(s<today)return;if(!state.rangeStart||state.rangeEnd){state.rangeStart=s;state.rangeEnd=null}else if(s<=state.rangeStart){state.rangeStart=s;state.rangeEnd=null}else{state.rangeEnd=s;refreshAvailability()}render()}
function calendarMonth(d){
  const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay(),cells=[];
  for(let i=0;i<start;i++)cells.push(null);for(let n=1;n<=last.getDate();n++)cells.push(new Date(y,m,n));
  const today=localDateStr(new Date());
  return `<div class="month"><div class="month-title">${y}년 ${m+1}월</div><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells.map(x=>{if(!x)return '<span></span>';const s=localDateStr(x),past=s<today,startC=s===state.rangeStart,endC=s===state.rangeEnd,inR=state.rangeStart&&state.rangeEnd&&s>state.rangeStart&&s<state.rangeEnd;return `<button class="day ${past?'disabled':''} ${startC?'range-start':''} ${endC?'range-end':''} ${inR?'in-range':''} ${s===today?'today':''}" ${past?'disabled':''} onclick="selectDay('${s}')">${x.getDate()}</button>`}).join('')}</div></div>`
}
function renderHeader(){const nav=state.view==='user'?`<button class="nav-btn active">예약 신청</button><button class="nav-btn" onclick="openLookup()">내 신청 조회</button><button class="nav-btn" onclick="goAdmin()">관리자</button>`:state.view==='login'?`<button class="nav-btn" onclick="goUser()">사용자 화면</button><button class="nav-btn active">관리자 로그인</button>`:`<button class="nav-btn" onclick="goUser()">사용자 화면</button><button class="nav-btn active">관리자</button><button class="nav-btn" onclick="adminLogout()">로그아웃</button>`;return `<header class="topbar"><div class="shell topbar-inner"><div class="brand"><div class="brand-mark">H</div><div><div class="brand-title">휴양소 통합 예약</div><div class="brand-sub">Company Resort Booking</div></div></div><nav class="topnav">${nav}</nav></div></header>`}
function renderUser(){
  const nights=diffNights(state.rangeStart,state.rangeEnd);
  return `${renderHeader()}<main><section class="hero"><div class="shell"><div class="hero-card"><div class="hero-kicker">EMPLOYEE RESORT</div><h1>날짜를 고르고, 가능한 휴양소를 바로 예약하세요.</h1><p>복잡한 설명 없이 일정 선택 → 휴양소 선택 → 신청 정보 입력의 세 단계로 끝납니다.</p><div class="hero-actions"><button class="primary-btn" style="background:#fff;color:#0f172a" onclick="document.getElementById('booking').scrollIntoView()">예약 시작</button><button class="ghost-btn" onclick="openLookup()">내 신청 결과 확인</button></div></div></div></section>
  <section id="booking" class="section"><div class="shell"><div class="booking-layout"><div class="card calendar-card"><div class="step-title"><span class="step-no">1</span> 이용 날짜 선택</div><div class="calendar-toolbar"><div><b>${nights?`${nights}박 일정 선택됨`:'입실일과 퇴실일을 선택하세요'}</b><div class="section-desc">체크아웃 날짜에는 객실을 사용하지 않는 기준입니다.</div></div><div class="cal-nav"><button class="icon-btn" onclick="state.calendarAnchor=addMonths(state.calendarAnchor,-1);render()">‹</button><button class="icon-btn" onclick="state.calendarAnchor=addMonths(state.calendarAnchor,1);render()">›</button></div></div><div class="calendar-grid-wrap">${calendarMonth(state.calendarAnchor)}${calendarMonth(addMonths(state.calendarAnchor,1))}</div><div class="date-summary"><div class="date-box"><span>입실</span><strong>${state.rangeStart?fmtDate(state.rangeStart):'선택'}</strong></div><div class="date-arrow">→</div><div class="date-box" style="text-align:right"><span>퇴실</span><strong>${state.rangeEnd?fmtDate(state.rangeEnd):'선택'}</strong></div></div>${nights?`<div class="nights-pill"><span class="badge dark">${nights}박 ${nights+1}일</span></div>`:''}</div>
  <aside class="card selection-panel"><div class="step-title"><span class="step-no">2</span> 이용 가능한 휴양소</div><p class="section-desc">선택 일정 기준 잔여 객실과 신청 조건을 한눈에 확인하세요.</p><div style="height:12px"></div>${renderResortList()}</aside></div></div></section></main><footer class="footer">휴양소 통합 예약 시스템 · 데이터는 Supabase에서 관리됩니다.</footer>`
}
function renderResortList(){
  if(!state.publicResorts.length)return `<div class="empty">등록된 휴양소가 없습니다.</div>`;
  const nights=diffNights(state.rangeStart,state.rangeEnd);
  return `<div class="resort-grid">${state.publicResorts.map(r=>{const p=activePeriod(r),remaining=state.availability[r.id],maxNight=Number(r.max_nights||2),nightOk=!nights||nights<=maxNight;let avText=!state.rangeEnd?'날짜 선택 필요':remaining===null||remaining===undefined?'확인 중':`${remaining}실 남음`;let avClass=remaining===0?'none':'good';const can=!!(state.rangeStart&&state.rangeEnd&&nightOk&&p.open);return `<article class="card resort-card">${resortCover(r)}<div class="resort-body"><div class="resort-title-row"><div><div class="resort-name">${esc(r.name)}</div><div class="resort-location">${esc(r.location||'')}</div></div><span class="badge ${p.c}">${p.open?'접수중':p.label==='신청 마감'?'마감':'예정'}</span></div><div class="resort-meta"><div class="meta-box"><b>${r.total_rooms||0}실</b><span>총 객실</span></div><div class="meta-box"><b>${r.max_capacity||0}명</b><span>최대 인원</span></div><div class="meta-box"><b>${maxNight}박</b><span>최대 숙박</span></div><div class="meta-box"><b>${esc(r.win_method||'-')}</b><span>선정 방식</span></div></div><div class="resort-desc">${esc(r.description||'휴양소 상세 정보를 확인하고 신청하세요.')}</div>${nights&&!nightOk?`<div class="notice red" style="margin-bottom:10px">선택한 ${nights}박 일정은 이 휴양소 최대 ${maxNight}박을 초과합니다.</div>`:''}<div class="resort-footer"><div><div class="availability ${avClass}">${avText}</div><div class="period-note">${p.label} · ${r.limit_period||'월'} ${r.limit_count||0}회</div></div><button class="primary-btn" ${can?'':'disabled'} onclick="openApplication('${r.id}')">신청하기</button></div></div></article>`}).join('')}</div>`
}
function openApplication(id){const r=state.publicResorts.find(x=>x.id===id);if(!r||!state.rangeStart||!state.rangeEnd)return;const nights=diffNights(state.rangeStart,state.rangeEnd);if(nights>Number(r.max_nights||2)){toast(`최대 ${r.max_nights||2}박까지 신청 가능합니다.`,'error');return}modal(`<div class="modal"><div class="modal-head"><div><div class="modal-title">${esc(r.name)} 신청</div><div class="section-desc">${fmtDate(state.rangeStart)} ~ ${fmtDate(state.rangeEnd)} · ${nights}박</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="applyForm" onsubmit="submitApplication(event,'${r.id}')"><div class="modal-body"><div class="notice blue" style="margin-bottom:16px">${r.win_method==='추첨제'?'신청 후 추첨대기로 접수됩니다. 추첨 완료 후 결과를 확인할 수 있습니다.':'잔여 객실이 있으면 즉시 확정되며, 만실이면 대기로 접수됩니다.'}</div><div class="form-grid"><div class="field"><label>이름</label><input class="input" name="name" required placeholder="홍길동"></div><div class="field"><label>사번</label><input class="input" name="employee_id" required inputmode="numeric" placeholder="123456"></div><div class="field"><label>부서</label><input class="input" name="department" required placeholder="총무팀"></div><div class="field"><label>이용 인원</label><select class="select" name="party_size">${Array.from({length:Number(r.max_capacity||1)},(_,i)=>`<option value="${i+1}">${i+1}명</option>`).join('')}</select></div><div class="field"><label>이메일</label><input class="input" type="email" name="email" required placeholder="name@company.com"></div><div class="field"><label>휴대폰</label><input class="input" name="phone" required placeholder="010-0000-0000"></div><div class="field full"><label class="checkline"><input type="checkbox" required> 입력 정보와 휴양소 이용 규정을 확인했으며 신청에 동의합니다.</label></div></div></div><div class="modal-foot"><button type="button" class="ghost-btn" onclick="closeModal()">취소</button><button type="submit" class="primary-btn">신청 완료</button></div></form></div>`)}
async function submitApplication(e,resortId){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='처리 중...';const f=new FormData(e.target);try{const out=await rpc('submit_application',{p_name:f.get('name'),p_employee_id:f.get('employee_id'),p_department:f.get('department'),p_email:f.get('email'),p_phone:f.get('phone'),p_resort_id:resortId,p_check_in:state.rangeStart,p_check_out:state.rangeEnd,p_party_size:Number(f.get('party_size'))});if(!out?.ok)throw new Error(out?.message||'신청에 실패했습니다.');closeModal();toast(out.message,'success');await refreshAvailability()}catch(err){toast(err.message,'error');btn.disabled=false;btn.textContent='신청 완료'}}
function openLookup(){modal(`<div class="modal"><div class="modal-head"><div><div class="modal-title">내 신청 조회</div><div class="section-desc">사번과 신청 시 입력한 이메일이 모두 일치해야 조회됩니다.</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><form onsubmit="lookupApps(event)" class="form-grid"><div class="field"><label>사번</label><input class="input" name="emp" required></div><div class="field"><label>이메일</label><input class="input" type="email" name="email" required></div><div class="field full"><button class="primary-btn" style="width:100%">조회하기</button></div></form><div id="lookupResult" style="margin-top:16px"></div></div></div>`)}
async function lookupApps(e){e.preventDefault();const f=new FormData(e.target),box=document.getElementById('lookupResult');box.innerHTML='<div class="empty"><span class="spinner"></span></div>';try{const rows=await rpc('lookup_my_applications',{p_employee_id:f.get('emp'),p_email:f.get('email')});box.innerHTML=rows?.length?`<div class="result-list">${rows.map(a=>`<div class="result-item"><div><b>${esc(a.resort_name)}</b><div class="row-sub">${fmtDate(a.check_in)} ~ ${fmtDate(a.check_out)} · ${a.nights||diffNights(a.check_in,a.check_out)}박</div></div><div class="dates">${a.party_size||1}명</div>${statusBadge(a.status)}</div>`).join('')}</div>`:'<div class="empty">조회되는 신청내역이 없습니다.</div>'}catch(err){box.innerHTML=`<div class="notice red">${esc(err.message)}</div>`}}
async function goAdmin(){if(state.session){state.view='admin';await loadAdminData();render()}else showAdminLogin()}
function goUser(){state.view='user';state.resorts=state.publicResorts;render()}
function showAdminLogin(){state.view='login';render()}
function renderLogin(){return `${renderHeader()}<div class="login-card"><h2>관리자 로그인</h2><p>Supabase Authentication에 등록한 관리자 계정으로 로그인하세요.</p><form onsubmit="adminLogin(event)"><div class="field"><label>이메일</label><input class="input" type="email" name="email" required></div><div class="field" style="margin-top:12px"><label>비밀번호</label><input class="input" type="password" name="password" required></div><button class="primary-btn" style="width:100%;margin-top:16px">로그인</button></form><div class="notice amber" style="margin-top:16px">관리자 계정은 Supabase → Authentication → Users에서 한 번만 만들어두면 됩니다.</div></div>`}
async function adminLogin(e){e.preventDefault();const f=new FormData(e.target),btn=e.submitter;btn.disabled=true;btn.textContent='로그인 중...';try{const res=await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:CONFIG.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const data=await res.json();if(!res.ok)throw new Error(data.error_description||data.msg||'로그인 실패');data.expires_at=Math.floor(Date.now()/1000)+(data.expires_in||3600);state.session=data;safeStoreSet('resort_admin_session',JSON.stringify(data));state.view='admin';await loadAdminData();render();toast('관리자 로그인 완료','success')}catch(err){toast(err.message,'error');btn.disabled=false;btn.textContent='로그인'}}
async function restoreSession(){try{let s=JSON.parse(safeStoreGet('resort_admin_session')||'null');if(!s)return;if((s.expires_at||0)<Math.floor(Date.now()/1000)+120&&s.refresh_token){const res=await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:CONFIG.anonKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(res.ok){const n=await res.json();n.expires_at=Math.floor(Date.now()/1000)+(n.expires_in||3600);s=n;safeStoreSet('resort_admin_session',JSON.stringify(n))}else throw new Error('expired')}state.session=s}catch{safeStoreRemove('resort_admin_session');state.session=null}}
async function adminLogout(){try{if(state.session)await fetch(`${CONFIG.supabaseUrl}/auth/v1/logout`,{method:'POST',headers:{apikey:CONFIG.anonKey,Authorization:`Bearer ${state.session.access_token}`}})}catch{}safeStoreRemove('resort_admin_session');state.session=null;state.view='user';await loadPublicResorts();render()}
async function loadAdminData(){
  try{const [resorts,apps,bl,runs,emails,logs,blocked]=await Promise.all([
    sb('/rest/v1/resorts?select=*&order=name.asc',{admin:true}),sb('/rest/v1/applications?select=*&order=created_at.desc&limit=3000',{admin:true}),sb('/rest/v1/blacklists?select=*&order=created_at.desc&limit=1000',{admin:true}),sb('/rest/v1/lottery_runs?select=*&order=executed_at.desc&limit=100',{admin:true}),sb('/rest/v1/email_logs?select=*&order=created_at.desc&limit=3000',{admin:true}),sb('/rest/v1/admin_logs?select=*&order=created_at.desc&limit=200',{admin:true}),sb('/rest/v1/resort_blocked_dates?select=*&order=start_date.desc&limit=1000',{admin:true})
  ]);state.resorts=resorts||[];state.applications=apps||[];state.blacklists=bl||[];state.lotteryRuns=runs||[];state.emailLogs=emails||[];state.adminLogs=logs||[];state.blockedDates=blocked||[];if(!state.lotteryResort)state.lotteryResort=(state.resorts.find(r=>r.win_method==='추첨제')||state.resorts[0])?.id||''}catch(e){toast('관리자 데이터 로딩 실패: '+e.message,'error')}
}
function adminNav(id,label,icon){return `<button class="${state.adminTab===id?'active':''}" onclick="state.adminTab='${id}';render()">${icon} ${label}</button>`}
function renderAdmin(){return `${renderHeader()}<main class="admin-page"><div class="shell"><div class="admin-layout"><aside class="card sidebar"><div class="side-user"><b>관리자</b><span>${esc(state.session?.user?.email||'')}</span></div><div class="side-nav">${adminNav('dashboard','대시보드','▦')}${adminNav('applications','예약관리','▤')}${adminNav('lottery','추첨관리','◉')}${adminNav('blacklist','블랙리스트','⛔')}${adminNav('email','확정메일','✉')}${adminNav('resorts','휴양소관리','⌂')}${adminNav('logs','작업로그','≡')}</div></aside><section class="admin-main">${renderAdminTab()}</section></div></div></main>`}
function renderAdminTab(){return ({dashboard:renderDashboard,applications:renderApplications,lottery:renderLottery,blacklist:renderBlacklist,email:renderEmail,resorts:renderResorts,logs:renderLogs}[state.adminTab]||renderDashboard)()}
function monthMatch(dateStr,month){return !month||String(dateStr||'').slice(0,7)===month}
function renderDashboard(){const nowMonth=monthValue(new Date()),appsM=state.applications.filter(a=>monthMatch(a.check_in,nowMonth)),confirmed=appsM.filter(a=>a.status==='confirmed').length,pending=appsM.filter(a=>a.status==='pending').length,black=state.blacklists.filter(b=>b.is_active&&(b.end_date===null||b.end_date>=localDateStr(new Date()))).length;return `<div class="admin-title-row"><div><h2>운영 대시보드</h2><div class="section-desc">이번 달 예약과 운영상태를 빠르게 확인합니다.</div></div><button class="ghost-btn" onclick="loadAdminData().then(render)">새로고침</button></div><div class="kpi-grid"><div class="card kpi"><span>이번 달 신청</span><strong>${appsM.length}</strong><small>${nowMonth}</small></div><div class="card kpi"><span>예약 확정</span><strong>${confirmed}</strong><small>확정 기준</small></div><div class="card kpi"><span>추첨 대기</span><strong>${pending}</strong><small>처리 필요</small></div><div class="card kpi"><span>신청 제한</span><strong>${black}</strong><small>활성 블랙리스트</small></div></div><div class="grid-2"><div class="card admin-section"><div class="section-head"><div><h3 class="section-title" style="font-size:17px">휴양소별 이번 달 신청</h3></div></div><div class="stat-bars">${state.resorts.map(r=>{const n=appsM.filter(a=>a.resort_id===r.id).length,max=Math.max(1,...state.resorts.map(x=>appsM.filter(a=>a.resort_id===x.id).length));return `<div class="stat-row"><b>${esc(r.short||r.name)}</b><div class="bar"><i style="width:${Math.round(n/max*100)}%"></i></div><span>${n}건</span></div>`}).join('')||'<div class="empty">데이터가 없습니다.</div>'}</div></div><div class="card admin-section"><h3 class="section-title" style="font-size:17px">처리 알림</h3><div class="result-list" style="margin-top:12px"><div class="result-item"><div><b>추첨 대기</b><div class="row-sub">이번 달 처리되지 않은 신청</div></div><span></span><span class="badge amber">${pending}건</span></div><div class="result-item"><div><b>메일 미발송</b><div class="row-sub">이번 달 확정자 중 발송이력 없음</div></div><span></span><span class="badge blue">${countUnsent(nowMonth)}건</span></div><div class="result-item"><div><b>활성 블랙리스트</b><div class="row-sub">현재 신청 제한 중</div></div><span></span><span class="badge red">${black}명</span></div></div></div></div>`}
function filteredApps(){return state.applications.filter(a=>{const f=state.appFilter;if(f.q&&!`${a.name} ${a.employee_id} ${a.department} ${a.email}`.toLowerCase().includes(f.q.toLowerCase()))return false;if(f.resort!=='all'&&a.resort_id!==f.resort)return false;if(f.status!=='all'&&a.status!==f.status)return false;if(f.month&&!monthMatch(a.check_in,f.month))return false;return true})}
function renderApplications(){const rows=filteredApps();return `<div class="admin-title-row"><div><h2>예약관리</h2><div class="section-desc">신청 검색, 상태 변경, 노쇼 처리와 내보내기를 한 곳에서 관리합니다.</div></div><button class="success-btn" onclick="exportAppsCsv()">Excel용 CSV</button></div><div class="card admin-section"><div class="toolbar"><input class="input search" placeholder="이름 · 사번 · 부서 · 이메일 검색" value="${esc(state.appFilter.q)}" oninput="state.appFilter.q=this.value;render()"><select class="select" onchange="state.appFilter.resort=this.value;render()"><option value="all">전체 휴양소</option>${state.resorts.map(r=>`<option value="${r.id}" ${state.appFilter.resort===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><select class="select" onchange="state.appFilter.status=this.value;render()"><option value="all">전체 상태</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${state.appFilter.status===k?'selected':''}>${v[0]}</option>`).join('')}</select><input class="input" type="month" value="${state.appFilter.month}" onchange="state.appFilter.month=this.value;render()"></div><div class="table-wrap"><table><thead><tr><th>신청자</th><th>휴양소</th><th>이용기간</th><th>인원</th><th>상태</th><th>가중치</th><th>관리</th></tr></thead><tbody>${rows.map(a=>appRow(a)).join('')}</tbody></table></div><div class="mobile-cards">${rows.map(a=>appMobile(a)).join('')}</div>${!rows.length?'<div class="empty">조건에 맞는 신청이 없습니다.</div>':''}</div>`}
function resortName(id){return state.resorts.find(r=>r.id===id)?.name||id}
function appRow(a){return `<tr><td><div class="row-title">${esc(a.name)}</div><div class="row-sub">${esc(a.employee_id)} · ${esc(a.department||'')}</div></td><td>${esc(resortName(a.resort_id))}</td><td>${fmtDate(a.check_in)} ~ ${fmtDate(a.check_out)}<div class="row-sub">${a.nights||diffNights(a.check_in,a.check_out)}박</div></td><td>${a.party_size||1}명</td><td>${statusBadge(a.status)}</td><td>${Number(a.weight||1).toFixed(1)}</td><td><select class="select" style="min-height:36px;padding:6px 8px;width:120px" onchange="changeAppStatus('${a.id}',this.value,'${a.resort_id}')">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v[0]}</option>`).join('')}</select> <button class="danger-btn" style="padding:7px 9px;min-height:36px" onclick="openNoShow('${a.id}')">노쇼</button></td></tr>`}
function appMobile(a){return `<div class="mobile-row"><div class="top"><div><div class="row-title">${esc(a.name)} · ${esc(a.employee_id)}</div><div class="row-sub">${esc(a.department||'')} · ${esc(resortName(a.resort_id))}</div></div>${statusBadge(a.status)}</div><div style="margin-top:8px">${fmtDate(a.check_in)} ~ ${fmtDate(a.check_out)} · ${a.nights||diffNights(a.check_in,a.check_out)}박 · ${a.party_size||1}명</div><div class="actions"><select class="select" style="flex:1" onchange="changeAppStatus('${a.id}',this.value,'${a.resort_id}')">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v[0]}</option>`).join('')}</select><button class="danger-btn" onclick="openNoShow('${a.id}')">노쇼 처리</button></div></div>`}
async function changeAppStatus(id,status,resortId){try{await sb(`/rest/v1/applications?id=eq.${id}`,{method:'PATCH',body:{status,updated_at:new Date().toISOString()},admin:true,headers:{Prefer:'return=minimal'}});if(['cancelled','no_show'].includes(status))await rpc('promote_waitlist',{p_resort_id:resortId},true);await loadAdminData();render();toast('상태가 변경되었습니다.','success')}catch(e){toast(e.message,'error')}}
function openNoShow(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const start=localDateStr(new Date()),end=localDateStr(addDays(new Date(),90));modal(`<div class="modal"><div class="modal-head"><div><div class="modal-title">노쇼 처리 및 신청 제한</div><div class="section-desc">${esc(a.name)} · ${esc(a.employee_id)}</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="submitNoShow(event,'${id}')"><div class="modal-body"><div class="form-grid"><div class="field"><label>제한 시작일</label><input class="input" type="date" name="start" value="${start}" required></div><div class="field"><label>제한 종료일</label><input class="input" type="date" name="end" value="${end}" required></div><div class="field full"><label>사유</label><select class="select" name="reason"><option>노쇼</option><option>규정위반</option><option>관리자 지정</option><option>기타</option></select></div><div class="field full"><label>관리자 메모</label><textarea class="textarea" name="memo"></textarea></div></div><div class="notice red" style="margin-top:14px">신청 상태가 노쇼로 변경되고 동일 사번에 신청 제한이 등록됩니다.</div></div><div class="modal-foot"><button type="button" class="ghost-btn" onclick="closeModal()">취소</button><button class="danger-btn">노쇼 처리</button></div></form></div>`)}
async function submitNoShow(e,id){e.preventDefault();const f=new FormData(e.target);try{const out=await rpc('mark_no_show_and_blacklist',{p_application_id:id,p_start_date:f.get('start'),p_end_date:f.get('end'),p_reason:f.get('reason'),p_memo:f.get('memo')},true);if(!out.ok)throw new Error(out.message);closeModal();await loadAdminData();render();toast(out.message,'success')}catch(err){toast(err.message,'error')}}
function exportAppsCsv(){const rows=filteredApps();const head=['이름','사번','부서','이메일','휴대폰','휴양소','입실','퇴실','박수','인원','상태','가중치'];const lines=[head,...rows.map(a=>[a.name,a.employee_id,a.department,a.email,a.phone,resortName(a.resort_id),a.check_in,a.check_out,a.nights||diffNights(a.check_in,a.check_out),a.party_size||1,STATUS[a.status]?.[0]||a.status,a.weight||1])].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download=`휴양소_예약현황_${localDateStr(new Date())}.csv`;x.click();URL.revokeObjectURL(url)}
function renderLottery(){const pending=state.applications.filter(a=>a.resort_id===state.lotteryResort&&a.status==='pending'&&monthMatch(a.check_in,state.lotteryMonth));const latest=state.selectedRun?state.lotteryRuns.find(r=>r.id===state.selectedRun):state.lotteryRuns.find(r=>r.resort_id===state.lotteryResort&&String(r.target_month).slice(0,7)===state.lotteryMonth);return `<div class="admin-title-row"><div><h2>추첨관리</h2><div class="section-desc">날짜별 실제 객실 재고를 확인하며 가중치 랜덤 추첨합니다.</div></div></div><div class="grid-2"><div class="card admin-section"><h3 class="section-title" style="font-size:17px">추첨 실행</h3><div class="form-grid" style="margin-top:14px"><div class="field"><label>휴양소</label><select class="select" onchange="state.lotteryResort=this.value;state.selectedRun=null;render()">${state.resorts.filter(r=>r.win_method==='추첨제').map(r=>`<option value="${r.id}" ${state.lotteryResort===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>대상 월</label><input class="input" type="month" value="${state.lotteryMonth}" onchange="state.lotteryMonth=this.value;state.selectedRun=null;render()"></div></div><div class="lottery-summary-grid" style="margin-top:14px"><div class="lottery-box"><strong>${pending.length}</strong><span>현재 추첨대기</span></div><div class="lottery-box"><strong>${pending.length?((pending.reduce((s,a)=>s+Number(a.weight||1),0)/pending.length).toFixed(2)):'0'}</strong><span>평균 가중치</span></div><div class="lottery-box"><strong>${state.resorts.find(r=>r.id===state.lotteryResort)?.total_rooms||0}</strong><span>일일 객실</span></div></div><button class="primary-btn" style="width:100%;margin-top:14px" onclick="runLottery()" ${pending.length?'':'disabled'}>가중치 추첨 실행</button><div class="notice amber" style="margin-top:12px">추첨은 숙박일별 객실 수를 초과하지 않도록 DB에서 한 번에 처리됩니다. 이미 확정된 예약도 재고에 포함됩니다.</div></div><div class="card admin-section"><h3 class="section-title" style="font-size:17px">최근 추첨 이력</h3><select class="select" style="margin-top:14px" onchange="selectLotteryRun(this.value)"><option value="">이력 선택</option>${state.lotteryRuns.map(r=>`<option value="${r.id}" ${latest?.id===r.id?'selected':''}>${String(r.target_month).slice(0,7)} · ${esc(resortName(r.resort_id))} · ${r.winner_count}명 당첨</option>`).join('')}</select>${latest?`<div class="lottery-summary-grid" style="margin-top:14px"><div class="lottery-box"><strong>${latest.candidate_count}</strong><span>대상</span></div><div class="lottery-box"><strong>${latest.winner_count}</strong><span>당첨</span></div><div class="lottery-box"><strong>${latest.failed_count}</strong><span>미당첨</span></div></div><div class="row-sub" style="margin-top:10px">${fmtDateTime(latest.executed_at)} · ${esc(latest.algorithm_version||'')}</div>`:'<div class="empty">선택한 조건의 추첨 이력이 없습니다.</div>'}</div></div>${state.selectedRun&&latest?renderLotteryDetail(latest):'<div class="card admin-section"><div class="empty">추첨 이력을 선택하면 날짜별 상세 결과를 확인할 수 있습니다.</div></div>'}`}
async function runLottery(){if(!confirm(`${state.lotteryMonth} 추첨을 실행할까요? 실행 후 해당 월 pending 신청은 확정/미당첨으로 처리됩니다.`))return;try{const out=await rpc('run_lottery',{p_resort_id:state.lotteryResort,p_target_month:`${state.lotteryMonth}-01`},true);state.selectedRun=out.run_id;await loadAdminData();await loadLotteryDetail(out.run_id);render();toast(`추첨 완료: ${out.winner_count}명 당첨`,'success')}catch(e){toast(e.message,'error')}}
async function selectLotteryRun(id){state.selectedRun=id||null;if(id)await loadLotteryDetail(id);render()}
async function loadLotteryDetail(id){try{state.lotterySummary=await rpc('get_lottery_daily_summary',{p_run_id:id},true)||[];state.lotteryResults=await sb(`/rest/v1/lottery_results?run_id=eq.${id}&select=*&order=result.desc,random_score.desc`,{admin:true})||[];state.lotteryDay=state.lotterySummary.find(x=>x.applicant_count>0)?.stay_date||state.lotterySummary[0]?.stay_date||null}catch(e){toast(e.message,'error')}}
function renderLotteryDetail(run){if(state.selectedRun===run.id&&!state.lotterySummary.length)loadLotteryDetail(run.id).then(render);const summary=state.lotterySummary,day=state.lotteryDay;const items=state.lotteryResults.map(x=>({...x,app:state.applications.find(a=>a.id===x.application_id)})).filter(x=>x.app&&(!day||(x.app.check_in<=day&&x.app.check_out>day)));return `<div class="card admin-section"><div class="section-head"><div><h3 class="section-title" style="font-size:17px">날짜별 추첨 결과</h3><p class="section-desc">날짜를 누르면 해당 날짜에 숙박하는 당첨·미당첨 신청자를 확인할 수 있습니다.</p></div></div>${summary.length?`<div class="day-grid">${summary.filter(x=>x.applicant_count>0||x.confirmed_count>0).map(x=>`<button class="day-stat ${day===x.stay_date?'active':''}" onclick="state.lotteryDay='${x.stay_date}';render()"><b>${String(x.stay_date).slice(5)}</b><span>신청 ${x.applicant_count} · 당첨 ${x.winner_count}</span><span>확정 ${x.confirmed_count}/${x.total_rooms} · 잔여 ${x.remaining_count}</span></button>`).join('')}</div>`:'<div class="empty">상세 데이터를 불러오는 중입니다.</div>'}${day?`<div style="margin-top:18px"><h4 style="margin:0 0 10px">${fmtDate(day)} 이용 신청자</h4><div class="result-list">${items.length?items.map(x=>`<div class="result-item"><div><b>${esc(x.app.name)} · ${esc(x.app.employee_id)}</b><div class="row-sub">${esc(x.app.department||'')}</div></div><div class="dates">${fmtDate(x.app.check_in)} ~ ${fmtDate(x.app.check_out)} · 가중치 ${Number(x.weight||1).toFixed(1)}</div><span class="badge ${x.result==='winner'?'green':'red'}">${x.result==='winner'?'당첨':'미당첨'}</span></div>`).join(''):'<div class="empty">해당 날짜 신청자가 없습니다.</div>'}</div></div>`:''}</div>`}
function renderBlacklist(){const today=localDateStr(new Date()),rows=state.blacklists.filter(b=>!state.blacklistQ||`${b.name} ${b.employee_id} ${b.reason}`.toLowerCase().includes(state.blacklistQ.toLowerCase()));return `<div class="admin-title-row"><div><h2>노쇼 · 블랙리스트</h2><div class="section-desc">이름과 사번으로 신청 제한 대상을 등록하고 기간을 관리합니다.</div></div><button class="primary-btn" onclick="openBlacklistAdd()">+ 신청 제한 등록</button></div><div class="card admin-section"><div class="toolbar"><input class="input search" placeholder="이름 · 사번 · 사유 검색" value="${esc(state.blacklistQ)}" oninput="state.blacklistQ=this.value;render()"></div><div class="table-wrap"><table><thead><tr><th>직원</th><th>사유</th><th>제한기간</th><th>상태</th><th>관리</th></tr></thead><tbody>${rows.map(b=>{const active=b.is_active&&b.start_date<=today&&(b.end_date===null||b.end_date>=today);return `<tr><td><div class="row-title">${esc(b.name)}</div><div class="row-sub">${esc(b.employee_id)}</div></td><td>${esc(b.reason)}<div class="row-sub">${esc(b.memo||'')}</div></td><td>${fmtDate(b.start_date)} ~ ${b.end_date?fmtDate(b.end_date):'무기한'}</td><td><span class="badge ${active?'red':'gray'}">${active?'신청 제한중':'비활성'}</span></td><td><button class="${b.is_active?'ghost-btn':'success-btn'}" style="padding:7px 9px;min-height:36px" onclick="toggleBlacklist('${b.id}',${!b.is_active})">${b.is_active?'해제':'재활성'}</button></td></tr>`}).join('')}</tbody></table></div><div class="mobile-cards">${rows.map(b=>`<div class="mobile-row"><div class="top"><div><div class="row-title">${esc(b.name)} · ${esc(b.employee_id)}</div><div class="row-sub">${esc(b.reason)}</div></div><span class="badge ${b.is_active?'red':'gray'}">${b.is_active?'제한':'해제'}</span></div><div style="margin-top:8px">${fmtDate(b.start_date)} ~ ${b.end_date?fmtDate(b.end_date):'무기한'}</div><div class="actions"><button class="ghost-btn" onclick="toggleBlacklist('${b.id}',${!b.is_active})">${b.is_active?'제한 해제':'재활성'}</button></div></div>`).join('')}</div>${!rows.length?'<div class="empty">등록 내역이 없습니다.</div>':''}</div>`}
function openBlacklistAdd(){const employees=[...new Map(state.applications.map(a=>[a.employee_id,a])).values()];modal(`<div class="modal"><div class="modal-head"><div><div class="modal-title">신청 제한 등록</div><div class="section-desc">사번을 입력하면 기존 신청자의 이름을 자동으로 찾습니다.</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="submitBlacklist(event)"><div class="modal-body"><datalist id="empList">${employees.map(a=>`<option value="${esc(a.employee_id)}">${esc(a.name)} · ${esc(a.department||'')}</option>`).join('')}</datalist><div class="form-grid"><div class="field"><label>사번</label><input class="input" list="empList" name="emp" required oninput="autofillEmployee(this.value)"></div><div class="field"><label>이름</label><input class="input" id="blName" name="name" required></div><div class="field"><label>제한 시작일</label><input class="input" type="date" name="start" value="${localDateStr(new Date())}" required></div><div class="field"><label>제한 종료일</label><input class="input" type="date" name="end" value="${localDateStr(addDays(new Date(),90))}"></div><div class="field full"><label>사유</label><select class="select" name="reason"><option>노쇼</option><option>규정위반</option><option>관리자 지정</option><option>기타</option></select></div><div class="field full"><label>관리자 메모</label><textarea class="textarea" name="memo"></textarea></div></div></div><div class="modal-foot"><button type="button" class="ghost-btn" onclick="closeModal()">취소</button><button class="primary-btn">등록</button></div></form></div>`)}
function autofillEmployee(emp){const a=state.applications.find(x=>x.employee_id===emp);if(a)document.getElementById('blName').value=a.name}
async function submitBlacklist(e){e.preventDefault();const f=new FormData(e.target);try{await sb('/rest/v1/blacklists',{method:'POST',body:{employee_id:f.get('emp'),name:f.get('name'),reason:f.get('reason'),start_date:f.get('start'),end_date:f.get('end')||null,memo:f.get('memo'),is_active:true,created_by:state.session?.user?.id||null},admin:true,headers:{Prefer:'return=minimal'}});closeModal();await loadAdminData();render();toast('신청 제한이 등록되었습니다.','success')}catch(err){toast(err.message,'error')}}
async function toggleBlacklist(id,val){try{await sb(`/rest/v1/blacklists?id=eq.${id}`,{method:'PATCH',body:{is_active:val},admin:true,headers:{Prefer:'return=minimal'}});await loadAdminData();render()}catch(e){toast(e.message,'error')}}
function confirmedForMonth(month){return state.applications.filter(a=>a.status==='confirmed'&&monthMatch(a.check_in,month))}
function sentAppIds(month){return new Set(state.emailLogs.filter(x=>x.status==='sent'&&String(x.target_month||'').slice(0,7)===month).map(x=>x.application_id))}
function countUnsent(month){const sent=sentAppIds(month);return confirmedForMonth(month).filter(a=>!sent.has(a.id)).length}
function renderEmail(){const rows=confirmedForMonth(state.emailMonth),sent=sentAppIds(state.emailMonth),unsent=rows.filter(a=>!sent.has(a.id));return `<div class="admin-title-row"><div><h2>예약 확정 안내메일</h2><div class="section-desc">월별 예약확정자를 확인하고 미발송자에게만 안내메일을 전송합니다.</div></div></div><div class="card admin-section"><div class="toolbar"><input class="input" type="month" value="${state.emailMonth}" onchange="state.emailMonth=this.value;render()"><button class="primary-btn" onclick="sendConfirmationEmails()" ${unsent.length?'':'disabled'}>미발송 ${unsent.length}명 일괄 발송</button></div><div class="kpi-grid"><div class="card kpi"><span>확정자</span><strong>${rows.length}</strong></div><div class="card kpi"><span>발송완료</span><strong>${rows.length-unsent.length}</strong></div><div class="card kpi"><span>미발송</span><strong>${unsent.length}</strong></div><div class="card kpi"><span>발송 실패 기록</span><strong>${state.emailLogs.filter(x=>x.status==='failed'&&String(x.target_month||'').slice(0,7)===state.emailMonth).length}</strong></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>직원</th><th>휴양소</th><th>이용기간</th><th>이메일</th><th>메일상태</th></tr></thead><tbody>${rows.map(a=>`<tr><td><div class="row-title">${esc(a.name)}</div><div class="row-sub">${esc(a.employee_id)}</div></td><td>${esc(resortName(a.resort_id))}</td><td>${fmtDate(a.check_in)} ~ ${fmtDate(a.check_out)}</td><td>${esc(a.email)}</td><td><span class="badge ${sent.has(a.id)?'green':'amber'}">${sent.has(a.id)?'발송완료':'미발송'}</span></td></tr>`).join('')}</tbody></table></div><div class="mobile-cards" style="margin-top:14px">${rows.map(a=>`<div class="mobile-row"><div class="top"><div><div class="row-title">${esc(a.name)} · ${esc(a.employee_id)}</div><div class="row-sub">${esc(a.email)}</div></div><span class="badge ${sent.has(a.id)?'green':'amber'}">${sent.has(a.id)?'발송':'미발송'}</span></div><div style="margin-top:8px">${esc(resortName(a.resort_id))} · ${fmtDate(a.check_in)} ~ ${fmtDate(a.check_out)}</div></div>`).join('')}</div>${!rows.length?'<div class="empty">해당 월 예약확정자가 없습니다.</div>':''}<div class="notice blue" style="margin-top:14px">메일 발송은 Supabase Edge Function과 메일 발송 서비스 키를 한 번 설정한 뒤 사용합니다. 이미 성공 기록이 있는 신청자는 자동으로 제외됩니다.</div></div>`}
async function sendConfirmationEmails(){if(!confirm(`${state.emailMonth} 미발송 확정자 ${countUnsent(state.emailMonth)}명에게 안내메일을 발송할까요?`))return;try{const res=await fetch(`${CONFIG.supabaseUrl}/functions/v1/${CONFIG.edgeFunction}`,{method:'POST',headers:{apikey:CONFIG.anonKey,Authorization:`Bearer ${state.session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({month:state.emailMonth})});const data=await res.json();if(!res.ok)throw new Error(data.error||data.message||'메일 발송 함수 오류');await loadAdminData();render();toast(`메일 처리 완료: 성공 ${data.sent||0}, 실패 ${data.failed||0}`,'success')}catch(e){toast('메일 발송 설정을 확인해주세요: '+e.message,'error')}}
function renderResorts(){return `<div class="admin-title-row"><div><h2>휴양소 운영관리</h2><div class="section-desc">객실수, 최대인원, 최대박수, 신청횟수, 접수기간과 운영중지일을 관리합니다.</div></div><button class="primary-btn" onclick="openResortEditor()">+ 휴양소 추가</button></div><div class="resort-admin-grid">${state.resorts.map(r=>`<div class="card resort-admin-card"><div class="head"><div><h4>${esc(r.icon||'🏨')} ${esc(r.name)}</h4><div class="row-sub">${esc(r.location||'')} · ${esc(r.win_method||'')}</div></div><span class="badge ${r.is_active?'green':'gray'}">${r.is_active?'운영중':'비활성'}</span></div><div class="mini-grid"><div class="mini"><span>객실</span><b>${r.total_rooms}실</b></div><div class="mini"><span>최대인원</span><b>${r.max_capacity}명</b></div><div class="mini"><span>최대박수</span><b>${r.max_nights||2}박</b></div><div class="mini"><span>신청제한</span><b>${r.limit_period} ${r.limit_count}회</b></div><div class="mini"><span>접수시작</span><b>${r.application_start?fmtDateTime(r.application_start):'상시'}</b></div><div class="mini"><span>접수마감</span><b>${r.application_end?fmtDateTime(r.application_end):'상시'}</b></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="ghost-btn" style="flex:1" onclick="openResortEditor('${r.id}')">수정</button><button class="${r.is_active?'danger-btn':'success-btn'}" onclick="toggleResort('${r.id}',${!r.is_active})">${r.is_active?'비활성':'운영재개'}</button></div></div>`).join('')}</div><div class="card admin-section"><div class="section-head"><div><h3 class="section-title" style="font-size:17px">운영중지일 · 예약불가 기간</h3><p class="section-desc">점검, 계약 제외일 등 예약을 받지 않을 기간을 등록합니다.</p></div><button class="ghost-btn" onclick="openBlockedDate()">+ 기간 추가</button></div><div class="result-list">${state.blockedDates.map(b=>`<div class="result-item"><div><b>${esc(resortName(b.resort_id))}</b><div class="row-sub">${esc(b.reason||'운영중지')}</div></div><div class="dates">${fmtDate(b.start_date)} ~ ${fmtDate(b.end_date)}</div><button class="danger-btn" style="padding:7px 9px;min-height:36px" onclick="deleteBlocked('${b.id}')">삭제</button></div>`).join('')||'<div class="empty">등록된 운영중지일이 없습니다.</div>'}</div></div>`}
function toLocalInput(v){if(!v)return '';const d=new Date(v),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,16)}
function openResortEditor(id=''){const r=id?state.resorts.find(x=>x.id===id):null;modal(`<div class="modal large"><div class="modal-head"><div><div class="modal-title">${r?'휴양소 수정':'휴양소 추가'}</div><div class="section-desc">운영조건은 사용자 화면에 즉시 반영됩니다.</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="saveResort(event,'${id}')"><div class="modal-body"><div class="form-grid"><div class="field"><label>휴양소명</label><input class="input" name="name" value="${esc(r?.name||'')}" required></div><div class="field"><label>약칭</label><input class="input" name="short" value="${esc(r?.short||'')}" required></div><div class="field"><label>지역</label><input class="input" name="location" value="${esc(r?.location||'')}" required></div><div class="field"><label>아이콘</label><input class="input" name="icon" value="${esc(r?.icon||'🏨')}"></div><div class="field"><label>총 객실수</label><input class="input" type="number" min="1" name="total_rooms" value="${r?.total_rooms||20}" required></div><div class="field"><label>객실 최대인원</label><input class="input" type="number" min="1" name="max_capacity" value="${r?.max_capacity||4}" required></div><div class="field"><label>최대 숙박 박수</label><input class="input" type="number" min="1" name="max_nights" value="${r?.max_nights||2}" required></div><div class="field"><label>선정 방식</label><select class="select" name="win_method"><option ${r?.win_method==='추첨제'?'selected':''}>추첨제</option><option ${r?.win_method==='선착순'?'selected':''}>선착순</option></select></div><div class="field"><label>신청 가능 횟수</label><input class="input" type="number" min="1" name="limit_count" value="${r?.limit_count||2}" required></div><div class="field"><label>횟수 기준</label><select class="select" name="limit_period">${['월','분기','년'].map(x=>`<option ${r?.limit_period===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>접수 시작</label><input class="input" type="datetime-local" name="application_start" value="${toLocalInput(r?.application_start)}"></div><div class="field"><label>접수 마감</label><input class="input" type="datetime-local" name="application_end" value="${toLocalInput(r?.application_end)}"></div><div class="field"><label>성수기 안내</label><input class="input" name="peak_season" value="${esc(r?.peak_season||'')}"></div><div class="field full"><label>대표 이미지 URL <small>(선택)</small></label><input class="input" name="image_url" value="${esc(r?.image_url||'')}" placeholder="https://..."></div><div class="field full"><label>설명</label><textarea class="textarea" name="description">${esc(r?.description||'')}</textarea></div></div></div><div class="modal-foot"><button type="button" class="ghost-btn" onclick="closeModal()">취소</button><button class="primary-btn">저장</button></div></form></div>`)}
async function saveResort(e,id){e.preventDefault();const f=new FormData(e.target),payload={name:f.get('name'),short:f.get('short'),location:f.get('location'),icon:f.get('icon')||'🏨',total_rooms:Number(f.get('total_rooms')),max_capacity:Number(f.get('max_capacity')),max_nights:Number(f.get('max_nights')),win_method:f.get('win_method'),limit_count:Number(f.get('limit_count')),limit_period:f.get('limit_period'),application_start:f.get('application_start')?new Date(f.get('application_start')).toISOString():null,application_end:f.get('application_end')?new Date(f.get('application_end')).toISOString():null,peak_season:f.get('peak_season'),image_url:f.get('image_url')||null,description:f.get('description'),is_active:id?(state.resorts.find(x=>x.id===id)?.is_active??true):true,status:'운영중'};try{if(id)await sb(`/rest/v1/resorts?id=eq.${id}`,{method:'PATCH',body:payload,admin:true,headers:{Prefer:'return=minimal'}});else await sb('/rest/v1/resorts',{method:'POST',body:{id:crypto.randomUUID(),...payload},admin:true,headers:{Prefer:'return=minimal'}});closeModal();await loadAdminData();await loadPublicResorts();state.view='admin';render();toast('휴양소 정보가 저장되었습니다.','success')}catch(err){toast(err.message,'error')}}
async function toggleResort(id,val){try{await sb(`/rest/v1/resorts?id=eq.${id}`,{method:'PATCH',body:{is_active:val},admin:true,headers:{Prefer:'return=minimal'}});await loadAdminData();render()}catch(e){toast(e.message,'error')}}
function openBlockedDate(){modal(`<div class="modal"><div class="modal-head"><div><div class="modal-title">운영중지 기간 등록</div></div><button class="icon-btn" onclick="closeModal()">✕</button></div><form onsubmit="saveBlocked(event)"><div class="modal-body"><div class="form-grid"><div class="field full"><label>휴양소</label><select class="select" name="resort">${state.resorts.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>시작일</label><input class="input" type="date" name="start" required></div><div class="field"><label>종료일</label><input class="input" type="date" name="end" required></div><div class="field full"><label>사유</label><input class="input" name="reason" placeholder="시설 점검"></div></div></div><div class="modal-foot"><button type="button" class="ghost-btn" onclick="closeModal()">취소</button><button class="primary-btn">등록</button></div></form></div>`)}
async function saveBlocked(e){e.preventDefault();const f=new FormData(e.target);try{await sb('/rest/v1/resort_blocked_dates',{method:'POST',body:{resort_id:f.get('resort'),start_date:f.get('start'),end_date:f.get('end'),reason:f.get('reason'),created_by:state.session?.user?.id||null},admin:true,headers:{Prefer:'return=minimal'}});closeModal();await loadAdminData();render();toast('운영중지 기간이 등록되었습니다.','success')}catch(err){toast(err.message,'error')}}
async function deleteBlocked(id){if(!confirm('이 운영중지 기간을 삭제할까요?'))return;try{await sb(`/rest/v1/resort_blocked_dates?id=eq.${id}`,{method:'DELETE',admin:true});await loadAdminData();render()}catch(e){toast(e.message,'error')}}
function renderLogs(){return `<div class="admin-title-row"><div><h2>관리자 작업로그</h2><div class="section-desc">예약, 휴양소, 블랙리스트 변경 이력을 최근 순으로 확인합니다.</div></div></div><div class="card admin-section"><div class="result-list">${state.adminLogs.map(l=>`<div class="result-item"><div><b>${esc(l.action)} · ${esc(l.entity_type)}</b><div class="row-sub">${esc(l.entity_id||'')}</div></div><div class="dates">${fmtDateTime(l.created_at)}</div><span class="badge gray">기록</span></div>`).join('')||'<div class="empty">아직 작업로그가 없습니다.</div>'}</div></div>`}
function render(){const root=document.getElementById('app');root.innerHTML=state.view==='admin'?renderAdmin():state.view==='login'?renderLogin():renderUser()}
window.addEventListener('resize',()=>{});
(async function init(){render();await restoreSession();await loadPublicResorts();render()})();
</script>
</body>
</html>
